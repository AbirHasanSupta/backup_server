services:
  # 1. Reverse Proxy & Ingress Load Balancer
  nginx:
    image: nginx:alpine
    container_name: backup_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - backup_cache:/app_data
    depends_on:
      api:
        condition: service_healthy
    networks:
      - backup_net

  # 2. FastAPI API Gateway (4 Gunicorn Workers)
  api:
    build: .
    container_name: backup_api
    restart: unless-stopped
    environment:
      - API_KEY=${API_KEY:?Set API_KEY in .env}
      - DATABASE_BACKEND=postgres
      - POSTGRES_URL=${POSTGRES_URL:?Set POSTGRES_URL in .env}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_ENABLED=true
      - REQUIRE_APPROVAL=${REQUIRE_APPROVAL:-false}
      - BACKUP_ROOT=/backup_storage
      - APP_DATA_DIR=/app_data
    volumes:
      - backup_storage:/backup_storage
      - backup_cache:/app_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/ping >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backup_net

  # 3. Dedicated Video Transcoding Worker (FFmpeg)
  celery_worker_video:
    build: .
    container_name: backup_celery_video
    restart: unless-stopped
    command: ["celery", "-A", "celery_app", "worker", "-Q", "transcode_video", "-c", "2", "-l", "INFO"]
    environment:
      - API_KEY=${API_KEY:?Set API_KEY in .env}
      - DATABASE_BACKEND=postgres
      - POSTGRES_URL=${POSTGRES_URL:?Set POSTGRES_URL in .env}
      - REDIS_URL=redis://redis:6379/0
      - REQUIRE_APPROVAL=${REQUIRE_APPROVAL:-false}
      - BACKUP_ROOT=/backup_storage
      - APP_DATA_DIR=/app_data
    volumes:
      - backup_storage:/backup_storage
      - backup_cache:/app_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backup_net

  # 4. General Background Task Worker (Rewind Reels & Trips/EXIF Indexing)
  celery_worker_general:
    build: .
    container_name: backup_celery_general
    restart: unless-stopped
    command: ["celery", "-A", "celery_app", "worker", "-Q", "render_rewind,indexing_queue", "-c", "2", "-l", "INFO"]
    environment:
      - API_KEY=${API_KEY:?Set API_KEY in .env}
      - DATABASE_BACKEND=postgres
      - POSTGRES_URL=${POSTGRES_URL:?Set POSTGRES_URL in .env}
      - REDIS_URL=redis://redis:6379/0
      - REQUIRE_APPROVAL=${REQUIRE_APPROVAL:-false}
      - BACKUP_ROOT=/backup_storage
      - APP_DATA_DIR=/app_data
    volumes:
      - backup_storage:/backup_storage
      - backup_cache:/app_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backup_net

  # 5. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: backup_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - POSTGRES_DB=backup_db
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - backup_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d backup_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 6. Redis In-Memory Cache & Pub/Sub Broker
  redis:
    image: redis:7-alpine
    container_name: backup_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - backup_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  redis_data:
  backup_storage:
  backup_cache:

networks:
  backup_net:
    driver: bridge
