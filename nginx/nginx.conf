# nginx/nginx.conf — High-Concurrency Reverse Proxy & Load Balancer
#
# Path-routes phone sync/upload to sync_api and interactive traffic to api
# so bulk backups cannot starve feed/reels/library/memories workers.

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # Docker assigns a new address when the API container is recreated.  Ask
    # Docker's embedded DNS to refresh it instead of pinning the upstream to
    # the address that existed when nginx first started.
    resolver 127.0.0.11 valid=10s ipv6=off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml;

    # Interactive app API (feed, reels, library, memories, admin, WS)
    upstream app_upstream {
        zone app_upstream 64k;
        least_conn;
        server api:8000 resolve max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    # Isolated sync/upload API (own Gunicorn + thread pool)
    upstream sync_upstream {
        zone sync_upstream 64k;
        least_conn;
        server sync_api:8000 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Maximum upload size for large 4K video backups
        client_max_body_size 5000M;
        client_body_buffer_size 16M;
        client_body_timeout 300s;

        # Proxy Buffering & HTTP/2 Streaming
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── Sync / upload (must outrank location /) ─────────────────────────
        # Exact check so /files/list|browse|download stay on app_upstream.
        # Do NOT route /api/sync/* here — admin history lives at /api/sync/history
        # on app-api (api/v1/admin.py), which is different from phone /sync/*.
        location = /files/check {
            proxy_pass http://sync_upstream;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_request_buffering off;
            proxy_buffering off;
        }
        location = /api/v1/files/check {
            proxy_pass http://sync_upstream;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        location ^~ /upload {
            proxy_pass http://sync_upstream;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            # Stream large resumable-upload chunks directly to FastAPI instead
            # of first spooling them to nginx's container filesystem.
            proxy_request_buffering off;
            proxy_buffering off;
        }
        location ^~ /api/v1/upload {
            proxy_pass http://sync_upstream;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        location ^~ /sync/ {
            proxy_pass http://sync_upstream;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_request_buffering off;
            proxy_buffering off;
        }
        location ^~ /api/v1/sync/ {
            proxy_pass http://sync_upstream;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_request_buffering off;
            proxy_buffering off;
        }

        # Sync heartbeats / activity — keep off app workers during bulk upload.
        location = /status {
            proxy_pass http://sync_upstream;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
        location = /api/status {
            proxy_pass http://sync_upstream;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
        location = /status/activity {
            proxy_pass http://sync_upstream;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
        location = /api/status/activity {
            proxy_pass http://sync_upstream;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # 1. Interactive API & Media Endpoints
        location / {
            proxy_pass http://app_upstream;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_request_buffering off;
            proxy_buffering off; # Low latency for HTTP range video playback
        }

        # 2. WebSocket Real-Time Gateway
        location /ws/ {
            proxy_pass http://app_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_read_timeout 86400s; # Long-lived connections
            proxy_send_timeout 86400s;
        }

        # 3. Micro-Thumbnail Static Cache
        location /cache/thumbnails/ {
            alias /app_data/thumbnail_cache/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri @fallback_to_api;
        }

        # 4. Web Admin Panel — SPA with cache-busting for JS/CSS assets
        location /admin {
            proxy_pass http://app_upstream;
            proxy_read_timeout 30s;
            # Tailwind CDN and static assets are loaded by browser — no proxy buffering needed
            proxy_buffering off;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location @fallback_to_api {
            proxy_pass http://app_upstream;
        }
    }
}
