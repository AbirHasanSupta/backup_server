# nginx/nginx.conf — High-Concurrency Reverse Proxy & Load Balancer

worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml;

    # Upstream Cluster: FastAPI Gunicorn/Uvicorn Workers
    upstream fastapi_app {
        least_conn;
        server api:8000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Maximum upload size for large 4K video backups
        client_max_body_size 5000M;
        client_body_buffer_size 16M;
        client_body_timeout 300s;

        # Proxy Buffering & HTTP/2 Streaming
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1. API & Media Endpoints
        location / {
            proxy_pass http://fastapi_app;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off; # Low latency for HTTP range video playback
        }

        # 2. WebSocket Real-Time Gateway
        location /ws/ {
            proxy_pass http://fastapi_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_read_timeout 86400s; # Long-lived connections
            proxy_send_timeout 86400s;
        }

        # 3. Micro-Thumbnail Static Cache
        location /cache/thumbnails/ {
            alias /app_data/thumbnail_cache/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            try_files $uri @fallback_to_api;
        }

        # 4. Web Admin Panel — SPA with cache-busting for JS/CSS assets
        location /admin {
            proxy_pass http://fastapi_app;
            proxy_read_timeout 30s;
            # Tailwind CDN and static assets are loaded by browser — no proxy buffering needed
            proxy_buffering off;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location @fallback_to_api {
            proxy_pass http://fastapi_app;
        }
    }
}
